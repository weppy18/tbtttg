<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tic-Tac-Toe: The Game</title>
    <meta
      name="description"
      content="The best web-based Tic-Tac-Toe: an unbeatable AI with four difficulty levels, Misère, 4×4, 5×5 and Ultimate variants, hints, analysis, and full offline play."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Tic-Tac-Toe: The Game" />
    <meta
      property="og:description"
      content="Unbeatable AI, four difficulty levels, Misère and Ultimate variants, hints and analysis. Plays offline."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Pre-hydration skeleton: paints the frame instantly, matches the app's layout to avoid shifts. */
      html {
        background: #f5f4ef;
        color: #16181d;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0b1020;
          color: #e8ecf5;
        }
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .sk {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px;
      }
      .sk h1 {
        margin: 0;
        font-size: clamp(1.25rem, 3.2vw, 1.75rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .sk p {
        margin: 0;
        opacity: 0.6;
        font-size: 0.85rem;
      }
      .sk-board {
        width: min(100%, 88vmin, 520px);
        aspect-ratio: 1;
        margin: 44px auto 0;
        border-radius: 14px;
        background: rgb(127 127 127 / 0.12);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk" aria-hidden="true">
        <h1>Tic-Tac-Toe</h1>
        <p>The game, perfected.</p>
        <div class="sk-board"></div>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui; padding: 1rem">
        Tic-Tac-Toe needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
